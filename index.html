      <div style="display:flex;justify-content:flex-end;margin-top:18px"><button class="primary-btn" data-complete="hangul">${progress.completedLessons.includes("hangul")?"Materi selesai ✓":"Tandai materi selesai"}</button></div>`}
    function letterTile(item,index,type){return `<button class="letter-tile" data-letter="${type}:${index}" aria-label="Lihat detail huruf ${item.letter}"><span class="letter-glyph" lang="ko">${item.letter}</span><span class="letter-roman">${item.roman}</span></button>`}
    function showLetter(type,index){const groups={consonant:consonants,tense:tenseConsonants,vowel:vowels,compound:compoundVowels};const labels={consonant:"konsonan dasar",tense:"konsonan tegang",vowel:"vokal dasar",compound:"vokal gabungan"};const item=groups[type][Number(index)];const soundText=`${item.letter} ${item.name}`;document.getElementById("modalRoot").innerHTML=`<div class="modal-backdrop" data-dismiss><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal-head"><h2 id="modalTitle">Detail ${labels[type]}</h2><button class="modal-close" data-close aria-label="Tutup">${icon("x",17)}</button></div><div class="modal-glyph" lang="ko">${item.letter}</div><div style="text-align:center;margin-bottom:14px;color:var(--muted);font-size:11px">${item.name}</div><div class="detail-grid"><div class="detail-box"><strong>Cara baca</strong><span>${item.roman} — ${item.sound}</span></div><div class="detail-box"><strong>Contoh kata / gabungan</strong><span lang="ko">${item.example}</span></div></div><div class="stroke-card"><h3>Urutan goresan (panduan sederhana)</h3><div class="stroke-steps">${item.strokes.map((stroke,i)=>`<span class="stroke-step"><b>${i+1}.</b> ${stroke}</span>`).join("")}</div></div><button class="primary-btn" data-speak="${escapeHTML(soundText)}" style="width:100%;margin-top:14px">${icon("volume-2",15)} Dengarkan pelafalan</button></section></div>`;document.querySelector("[data-close]").addEventListener("click",closeModal);document.querySelector("[data-dismiss]").addEventListener("click",event=>{if(event.target===event.currentTarget)closeModal()});document.querySelector("[data-speak]").addEventListener("click",event=>speak(event.currentTarget.dataset.speak));refreshIcons()}
    function closeModal(){document.getElementById("modalRoot").innerHTML=""}
    function renderVocab(){const categories=["Semua",...new Set(vocabulary.map(item=>item.category))];const filtered=vocabulary.filter(item=>(activeCategory==="Semua"||item.category===activeCategory)&&`${item.word} ${item.roman} ${item.meaning}`.toLowerCase().includes(searchQuery.toLowerCase()));return `<div class="eyebrow">${icon("book-open",14)} MODUL 02</div><h1 class="page-title">Kamus & Kosakata</h1><p class="page-description">${vocabulary.length} kata praktis, dikelompokkan berdasarkan situasi. Cari kata, dengarkan pengucapannya, dan tandai kata yang sudah kamu kuasai.</p><div class="toolbar"><label class="search-wrap">${icon("search",16)}<input id="vocabSearch" type="search" placeholder="Cari kata Korea atau artinya..." value="${escapeHTML(searchQuery)}" aria-label="Cari kosakata"></label></div><div class="toolbar">${categories.map(category=>`<button class="chip ${activeCategory===category?"selected":""}" data-category="${escapeHTML(category)}">${category}</button>`).join("")}</div><div class="vocab-list">${filtered.length?filtered.map(item=>`<article class="card vocab-row"><div class="vocab-hangul" lang="ko">${item.word}</div><div class="vocab-meaning"><strong>${item.meaning}</strong><span>${item.roman}</span></div><span class="tag">${item.category}</span><button class="speak-btn" data-speak="${escapeHTML(item.word)}" aria-label="Dengarkan ${escapeHTML(item.word)}">${icon("volume-2",15)}</button><button class="speak-btn" data-know="${escapeHTML(item.word)}" aria-label="Tandai kosakata ${escapeHTML(item.word)} ${progress.knownWords.includes(item.word)?"belum hafal":"sudah hafal"}" title="${progress.knownWords.includes(item.word)?"Sudah hafal":"Tandai hafal"}" style="${progress.knownWords.includes(item.word)?"background:#e8f7f0;color:#249b78":""}">${icon(progress.knownWords.includes(item.word)?"check":"bookmark-check",15)}</button></article>`).join(""):`<div class="card empty-state">Tidak ada kosakata yang cocok. Coba kata lain, ya.</div>`}</div><div style="display:flex;justify-content:space-between;align-items:center;margin-top:14px;color:var(--muted);font-size:10px"><span>${filtered.length} kata ditemukan</span><span>${progress.knownWords.length}/${vocabulary.length} sudah dikuasai</span></div>`}
    function renderGrammar(){return `<div class="eyebrow">${icon("spell-check",14)} MODUL 03</div><h1 class="page-title">Tata Bahasa Dasar</h1><p class="page-description">Pahami pola inti bahasa Korea lewat ringkasan singkat dan contoh kalimat dengan terjemahannya.</p><div class="grammar-callout"><h3>Urutan kalimat Korea: S-O-K-P</h3><p>Subjek + Objek + Keterangan + Predikat. Predikat biasanya berada di akhir kalimat. Partikel membantu menunjukkan fungsi kata, jadi urutannya lebih fleksibel daripada Bahasa Indonesia.</p><div class="example" style="background:#ffffffa8;margin-top:10px" lang="ko">저는 한국어를 학교에서 공부해요.<small>Saya belajar bahasa Korea di sekolah. — 저는 (S) + 한국어를 (O) + 학교에서 (K) + 공부해요 (P)</small></div></div><div class="section-heading"><h2>Partikel penting</h2><span class="tag">4 topik</span></div><section class="grammar-grid">${grammar.map(item=>`<article class="card grammar-card"><span class="tag">${item.particle}</span><h3>${item.title}</h3><p>${item.description}</p><div class="example" lang="ko">${item.example}<small>${item.translation}</small></div><p style="margin-bottom:0"><strong>Ingat:</strong> ${item.tip}</p></article>`).join("")}</section><div style="display:flex;justify-content:flex-end;margin-top:18px"><button class="primary-btn" data-complete="grammar">${progress.completedLessons.includes("grammar")?"Materi selesai ✓":"Tandai materi selesai"}</button></div>`}
    function renderPractice(){return `<div class="eyebrow">${icon("brain",14)} MODUL 04</div><h1 class="page-title">Ruang Latihan</h1><p class="page-description">Latih ingatan dengan kartu kosakata, uji pemahaman lewat kuis, susun kata, atau praktikkan percakapan sehari-hari.</p><div class="mode-tabs">${[["flashcards","layers","Flashcard"],["quiz","list-checks","Kuis bertingkat"],["build","puzzle","Susun kata"],["scenario","messages-square","Skenario"]].map(([mode,iconName,label])=>`<button class="mode-tab ${practiceMode===mode?"selected":""}" data-mode="${mode}">${icon(iconName,14)} ${label}</button>`).join("")}</div>${practiceMode==="flashcards"?renderFlashcards():practiceMode==="quiz"?renderQuiz():practiceMode==="build"?renderWordBuild():renderScenario()}`}
    function renderScenario(){const scenario=scenarios[scenarioIndex];const step=scenario.steps[scenarioStep];return `<div class="scenario-grid">${scenarios.map((item,index)=>`<button class="scenario-choice ${scenarioIndex===index?"selected":""}" data-scenario="${index}">${item.title}${progress.completedScenarios.includes(item.id)?" ✓":""}</button>`).join("")}</div><section class="card scenario-panel"><div class="question-label">${scenario.role}</div><h2 class="question-title">${scenario.title}</h2><p class="page-description">Misi: ${scenario.goal}</p>${scenarioFinished?`<div class="feedback"><strong>Latihan selesai! 잘했어요 🎉</strong> Kamu sudah menyelesaikan skenario ini. Pilih situasi lain untuk berlatih lagi.</div><div class="scenario-tip"><strong>Tips:</strong> Ucapkan frasa dengan pelan dan sopan. Dengarkan akhiran kalimat saat berlatih.</div><div class="practice-footer"><span>${scenario.steps.length} langkah selesai</span><button class="primary-btn" data-scenario-action="restart">Ulangi skenario</button></div>`:`<div class="scenario-dialogue"><div class="question-label">Langkah ${scenarioStep+1} dari ${scenario.steps.length}</div><h3 class="question-title" style="font-size:15px">${step.prompt}</h3><div class="scenario-tip"><strong>Tips:</strong> ${step.tip}</div><div class="answer-list">${step.options.map((option,index)=>{let state="";if(scenarioChoice!==null){if(index===step.answer)state="correct";else if(index===scenarioChoice)state="incorrect"}return `<button class="answer-option ${state}" data-scenario-answer="${index}" ${scenarioChoice!==null?"disabled":""}>${option}</button>`}).join("")}</div>${scenarioChoice!==null?`<div class="feedback"><strong>${scenarioChoice===step.answer?"Tepat! 🎉":"Coba ingat lagi."}</strong> ${step.explanation}</div>`:""}<div class="practice-footer"><span style="color:var(--muted);font-size:10px">Progres skenario: ${progress.completedScenarios.includes(scenario.id)?"Selesai sebelumnya":"Sedang latihan"}</span>${scenarioChoice!==null?`<button class="primary-btn" data-scenario-action="next">${scenarioStep===scenario.steps.length-1?"Selesaikan":"Langkah berikutnya"} ${icon("arrow-right",14)}</button>`:""}</div></div>`}</section>`}
    function renderFlashcards(){const item=vocabulary[flashIndex%vocabulary.length];const known=progress.knownWords.includes(item.word);return `<section class="card practice-card"><div style="display:flex;justify-content:space-between;color:var(--muted);font-size:10px"><span>Kartu ${flashIndex%vocabulary.length+1} / ${vocabulary.length}</span><span>${progress.knownWords.length} kata dikuasai</span></div><div class="flashcard" id="flashCard" role="button" tabindex="0" aria-label="Balik kartu untuk melihat arti"><span class="tag">${item.category}</span><div class="big-hangul" lang="ko">${flashRevealed?item.meaning:item.word}</div><p>${flashRevealed?item.roman:"Ketuk kartu untuk melihat arti"}</p></div><div class="flashcard-actions"><button class="secondary-btn" data-flash="again">${icon("rotate-ccw",14)} Lihat lagi</button><button class="primary-btn" data-flash="${known?"next":"known"}">${known?"Sudah hafal ✓":`${icon("check",14)} Saya hafal`}</button></div><div class="practice-footer"><button class="text-link" data-flash="prev">← Sebelumnya</button><button class="text-link" data-flash="next">Berikutnya →</button></div></section>`}
    function renderQuiz(){const levelMenu=`<div class="section-heading"><h2>Pilih level latihan</h2><span class="tag">${quizLevels.length} level</span></div><div class="scenario-grid">${quizLevels.map((level,index)=>`<button class="scenario-choice ${quizLevel===index?"selected":""}" data-quiz-level="${index}">${level.title}</button>`).join("")}</div>`;if(quizLevel<0)return `${levelMenu}<p class="page-description">Mulai dari pengenalan huruf, lalu lanjut ke suku kata, konsonan tegang, vokal gabungan, dan kosakata.</p>`;const level=quizLevels[quizLevel];if(quizFinished){const percent=Math.round(quizScore/quizQuestions.length*100);return `${levelMenu}<section class="card practice-card" style="text-align:center"><div class="stat-icon" style="margin:5px auto 12px;width:48px;height:48px">${icon(percent>=70?"trophy":"rotate-ccw",24)}</div><div class="question-label">${level.title} selesai</div><h2 style="margin:8px 0;font-size:26px">${percent}%</h2><p class="page-description">${quizScore} dari ${quizQuestions.length} jawaban benar. ${percent>=70?"Hebat! Pilih level berikutnya atau ulangi untuk memperkuat ingatan.":"Ulangi level ini atau pelajari materinya sebelum lanjut."}</p><button class="primary-btn" data-quiz="restart">Ulangi level</button></section>`}const item=quizQuestions[quizIndex];return `${levelMenu}<section class="card practice-card"><div class="question-label">${level.title} · ${level.description}</div><div style="display:flex;justify-content:space-between;color:var(--muted);font-size:10px;margin-top:12px"><span>Pertanyaan ${quizIndex+1} dari ${quizQuestions.length}</span><span>Skor: ${quizScore}</span></div><div class="progress-track practice-progress"><div class="progress-fill" style="width:${(quizIndex/quizQuestions.length)*100}%"></div></div><div class="question-label">Pilih jawaban yang paling tepat</div><h2 class="question-title">${item.question}</h2><div class="answer-list">${item.options.map((option,index)=>{let state="";if(quizChoice!==null){if(index===item.answer)state="correct";else if(index===quizChoice)state="incorrect"}return `<button class="answer-option ${state}" data-answer="${index}" ${quizChoice!==null?"disabled":""}>${String.fromCharCode(65+index)}. ${option} ${quizChoice!==null&&index===item.answer?"✓":""}</button>`}).join("")}</div>${quizChoice!==null?`<div class="feedback"><strong>${quizChoice===item.answer?"Benar! 🎉":"Belum tepat."}</strong> ${item.explanation}</div>`:""}<div class="practice-footer"><span style="color:var(--muted);font-size:10px">${quizScore} benar sejauh ini</span>${quizChoice!==null?`<button class="primary-btn" data-quiz="next">${quizIndex===quizQuestions.length-1?"Lihat hasil":"Lanjut"} ${icon("arrow-right",14)}</button>`:""}</div></section>`}
    function renderWordBuild(){const challenge=wordChallenges[buildIndex%wordChallenges.length];const options=[...challenge.tokens,...challenge.distractors];return `<section class="card practice-card"><div class="question-label">Susun kata • Tantangan ${buildIndex%wordChallenges.length+1}</div><h2 class="question-title">${challenge.prompt}</h2><div class="build-answer" aria-label="Susunan jawaban">${buildSelected.map((token,index)=>`<button class="token" data-remove-token="${index}">${token} ×</button>`).join("")||`<span style="align-self:center;color:var(--muted);font-size:10px">Ketuk kata di bawah sesuai urutan kalimat.</span>`}</div><div class="token-bank">${options.map((token,index)=>`<button class="token" data-token="${index}" ${buildSelected.filter(item=>item===token).length>=options.slice(0,index+1).filter(item=>item===token).length?"disabled":""}>${token}</button>`).join("")}</div>${buildChecked?`<div class="feedback"><strong>${isBuildCorrect(challenge)?"Benar! 🎉":"Perhatikan susunannya."}</strong> ${challenge.explanation}</div>`:""}<div class="practice-footer"><button class="secondary-btn" data-build="clear">Hapus susunan</button><button class="primary-btn" data-build="${buildChecked?"next":"check"}" ${!buildChecked&&buildSelected.length===0?"disabled":""}>${buildChecked?"Tantangan berikutnya":"Periksa jawaban"} ${icon(buildChecked?"arrow-right":"check",14)}</button></div></section>`}
    function isBuildCorrect(challenge){return JSON.stringify(buildSelected)===JSON.stringify(challenge.answer)}
    function renderProgress(){const known=progress.knownWords.length;const lessons=progress.completedLessons.length;const quizPct=progress.quizBest;const days=Array.from({length:7},(_,i)=>{const date=new Date();date.setDate(date.getDate()-(6-i));const key=date.toISOString().slice(0,10);return{label:new Intl.DateTimeFormat("id-ID",{weekday:"short"}).format(date).slice(0,2),done:progress.studyDays.includes(key)}});return `<div class="eyebrow">${icon("chart-no-axes-column-increasing",14)} PERJALANAN BELAJARMU</div><h1 class="page-title">Progres Belajar</h1><p class="page-description">${authUser?"Progres akun Google disinkronkan antarperangkat.":"Progres tersimpan di browser ini. Masuk dengan Google untuk melanjutkan di perangkat lain."} Terus belajar sedikit demi sedikit, ya!</p><section class="stats-grid">${statCard("Materi selesai",lessons,"Papan Hangeul & tata bahasa","circle-check")}${statCard("Kosakata dikuasai",known,`dari ${vocabulary.length} kata tersedia`,"book-marked")}${statCard("Skor terbaik",quizPct?`${quizPct}%`:"—",`${progress.quizRuns} percobaan kuis`,"trophy")}${statCard("Daily streak",`${progress.streak} 🔥`,progress.lastStudyDate?`Belajar terakhir ${progress.lastStudyDate}`:"Belum mulai belajar","flame")}</section><div class="progress-layout"><section class="card progress-panel"><h3>Ringkasan materi</h3>${progressRow("Papan Hangeul",lessonsDone("hangul")?100:0,`${lessonsDone("hangul")?"Selesai":"Belum selesai"}`)}${progressRow("Tata bahasa",lessonsDone("grammar")?100:0,`${lessonsDone("grammar")?"Selesai":"Belum selesai"}`)}${progressRow("Kosakata",Math.round(known/vocabulary.length*100),`${known} dari ${vocabulary.length} kata`)}${progressRow("Kuis",quizPct,quizPct?`Skor terbaik ${quizPct}%`:"Belum dicoba")}${progressRow("Skenario percakapan",Math.round(progress.completedScenarios.length/scenarios.length*100),`${progress.completedScenarios.length} dari ${scenarios.length} skenario`)}</section><section class="card progress-panel"><h3>Konsistensi 7 hari</h3><p style="margin:0;color:var(--muted);font-size:10px">Hari belajar akan tercatat saat kamu berlatih.</p><div class="streak-calendar">${days.map(day=>`<div class="day-dot ${day.done?"done":""}"><span>${day.done?"✓":"·"}</span>${day.label}</div>`).join("")}</div><div class="grammar-callout" style="margin-top:18px"><h3>Terus semangat! 🌱</h3><p>Latihan singkat yang rutin lebih efektif daripada belajar lama hanya sekali-sekali.</p></div></section></div>`}
    function lessonsDone(id){return progress.completedLessons.includes(id)}
    function progressRow(title,percent,note){return `<div class="progress-row"><div class="progress-text"><div style="display:flex;justify-content:space-between;margin-bottom:7px"><strong>${title}</strong><span class="progress-num">${note}</span></div><div class="progress-track"><div class="progress-fill" style="width:${percent}%"></div></div></div><strong class="progress-num">${percent}%</strong></div>`}
    function bindPageEvents(){document.querySelectorAll("[data-go]").forEach(element=>element.addEventListener("click",()=>navigate(element.dataset.go)));document.querySelectorAll("[data-letter]").forEach(element=>element.addEventListener("click",()=>{const [type,index]=element.dataset.letter.split(":");showLetter(type,index)}));document.querySelectorAll("[data-complete]").forEach(element=>element.addEventListener("click",()=>completeLesson(element.dataset.complete)));document.querySelectorAll("[data-category]").forEach(button=>button.addEventListener("click",()=>{activeCategory=button.dataset.category;renderPage();document.getElementById("vocabSearch")?.focus()}));const search=document.getElementById("vocabSearch");if(search)search.addEventListener("input",event=>{searchQuery=event.target.value;const cursor=event.target.selectionStart;renderPage();const next=document.getElementById("vocabSearch");next.focus();next.setSelectionRange(cursor,cursor)});document.querySelectorAll("[data-speak]").forEach(button=>button.addEventListener("click",()=>speak(button.dataset.speak)));document.querySelectorAll("[data-know]").forEach(button=>button.addEventListener("click",()=>toggleKnown(button.dataset.know)));document.querySelectorAll("[data-mode]").forEach(button=>button.addEventListener("click",()=>{practiceMode=button.dataset.mode;renderPage()}));document.querySelectorAll("[data-flash]").forEach(button=>button.addEventListener("click",()=>handleFlash(button.dataset.flash)));const flash=document.getElementById("flashCard");if(flash){flash.addEventListener("click",()=>{flashRevealed=!flashRevealed;markStudy();renderPage()});flash.addEventListener("keydown",event=>{if(event.key==="Enter"||event.key===" "){event.preventDefault();flash.click()}})}document.querySelectorAll("[data-quiz-level]").forEach(button=>button.addEventListener("click",()=>startQuiz(Number(button.dataset.quizLevel))));document.querySelectorAll("[data-answer]").forEach(button=>button.addEventListener("click",()=>answerQuiz(Number(button.dataset.answer))));document.querySelectorAll("[data-quiz]").forEach(button=>button.addEventListener("click",()=>handleQuiz(button.dataset.quiz)));document.querySelectorAll("[data-token]").forEach(button=>button.addEventListener("click",()=>{if(buildChecked)return;const challenge=wordChallenges[buildIndex%wordChallenges.length];const choices=[...challenge.tokens,...challenge.distractors];const index=Number(button.dataset.token);const countBefore=choices.slice(0,index).filter(token=>token===choices[index]).length;const usedCount=buildSelected.filter(token=>token===choices[index]).length;if(usedCount===countBefore){buildSelected.push(choices[index]);markStudy();renderPage()}}));document.querySelectorAll("[data-remove-token]").forEach(button=>button.addEventListener("click",()=>{if(buildChecked)return;buildSelected.splice(Number(button.dataset.removeToken),1);renderPage()}));document.querySelectorAll("[data-build]").forEach(button=>button.addEventListener("click",()=>handleBuild(button.dataset.build)))}
    function bindScenarioEvents(){document.querySelectorAll("[data-scenario]").forEach(button=>button.addEventListener("click",()=>{scenarioIndex=Number(button.dataset.scenario);scenarioStep=0;scenarioChoice=null;scenarioFinished=false;renderPage()}));document.querySelectorAll("[data-scenario-answer]").forEach(button=>button.addEventListener("click",()=>{if(scenarioChoice!==null)return;scenarioChoice=Number(button.dataset.scenarioAnswer);markStudy();renderPage()}));document.querySelectorAll("[data-scenario-action]").forEach(button=>button.addEventListener("click",()=>{if(button.dataset.scenarioAction==="restart"){scenarioStep=0;scenarioChoice=null;scenarioFinished=false}else if(scenarioStep<scenarios[scenarioIndex].steps.length-1){scenarioStep++;scenarioChoice=null}else{scenarioFinished=true;const id=scenarios[scenarioIndex].id;if(!progress.completedScenarios.includes(id))progress.completedScenarios.push(id);saveProgress();markStudy();toast("Skenario selesai! Progresmu tersimpan ✨")}renderPage()}))}
    function toggleKnown(word){markStudy();if(progress.knownWords.includes(word))progress.knownWords=progress.knownWords.filter(item=>item!==word);else progress.knownWords.push(word);saveProgress();renderPage()}
    function handleFlash(action){if(action==="known"){const word=vocabulary[flashIndex%vocabulary.length].word;if(!progress.knownWords.includes(word))progress.knownWords.push(word);markStudy();saveProgress()}if(action==="next"||action==="known"){flashIndex=(flashIndex+1)%vocabulary.length;flashRevealed=false;markStudy()}if(action==="prev"){flashIndex=(flashIndex-1+vocabulary.length)%vocabulary.length;flashRevealed=false}if(action==="again")flashRevealed=!flashRevealed;renderPage()}
    function startQuiz(levelIndex){quizLevel=levelIndex;quizQuestions=[...quizLevels[levelIndex].questions].sort(()=>Math.random()-.5);quizIndex=0;quizScore=0;quizChoice=null;quizFinished=false;renderPage()}
    function answerQuiz(choice){if(quizChoice!==null)return;quizChoice=choice;if(choice===quizQuestions[quizIndex].answer)quizScore++;markStudy();renderPage()}
    function handleQuiz(action){if(action==="restart"){startQuiz(quizLevel);return}if(quizIndex===quizQuestions.length-1){quizFinished=true;progress.quizRuns++;progress.quizBest=Math.max(progress.quizBest,Math.round(quizScore/quizQuestions.length*100));markStudy();saveProgress()}else{quizIndex++;quizChoice=null}renderPage()}
    function handleBuild(action){if(action==="clear"){buildSelected=[];buildChecked=false}else if(action==="check"){buildChecked=true;markStudy()}else if(action==="next"){buildIndex++;buildSelected=[];buildChecked=false;markStudy()}renderPage()}
    document.getElementById("themeToggle").addEventListener("click",()=>{const next=document.documentElement.dataset.theme==="dark"?"light":"dark";document.documentElement.dataset.theme=next;localStorage.setItem("klingo-id-theme",next);document.getElementById("themeToggle").innerHTML=icon(next==="dark"?"sun":"moon");refreshIcons()});
    document.getElementById("accountButton").addEventListener("click",handleAccountButton);
    const storedTheme=localStorage.getItem("klingo-id-theme");if(storedTheme==="dark")document.documentElement.dataset.theme="dark";document.getElementById("themeToggle").innerHTML=icon(storedTheme==="dark"?"sun":"moon");renderNav();renderPage();initializeFirebase();
  </script>
</body>
</html>
